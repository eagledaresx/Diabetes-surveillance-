<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#09090b"/>
  <circle cx="256" cy="256" r="230" stroke="#f43f5e" stroke-width="8" stroke-dasharray="16 12" opacity="0.6"/>
  
  <!-- Outer Glow Filter -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f43f5e" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <!-- Blood Glucose Drop -->
  <path d="M 256 70 C 256 70 120 230 120 330 A 136 136 0 0 0 392 330 C 392 230 256 70 256 70 Z" 
        fill="url(#dropGrad)" 
        filter="url(#glow)"/>

  <!-- Inner Medical Cross & Pulse Wave -->
  <!-- Horizontal bar -->
  <rect x="176" y="306" width="160" height="40" rx="10" fill="#ffffff"/>
  <!-- Vertical bar -->
  <rect x="236" y="246" width="40" height="160" rx="10" fill="#ffffff"/>

  <!-- Little droplet reflection -->
  <ellipse cx="195" cy="265" rx="16" ry="32" transform="rotate(-30 195 265)" fill="#ffffff" opacity="0.35"/>
</svg>
